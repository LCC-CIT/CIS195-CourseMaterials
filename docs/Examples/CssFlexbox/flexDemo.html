<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Flex Example</title>
    <style>
        div {
            display: flex;
            flex-direction: row;
            height:300px;
            width: 200px;
            flex-flow: wrap;
        }


        p {
            height:50px;
            with:75px;
        } 

        p, div {
            border:solid;
        }
    </style>
</head>

<body>
    <div>
        <p>Paragraph 1<br>Line 2</p>
        <p style="font-size: larger;">Paragraph 2</p>
        <p style="font-size: smaller;">Paragraph 3</p>
    </div>
</body>

</html>
