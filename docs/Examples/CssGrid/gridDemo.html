<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Grid Example</title>
</head>

<style>
    .container {
        display: grid;
        grid-template-columns: 200px 200px 200px;
        grid-template-rows: 50px 50px 50px 50px;
        gap: 10px;
    }

    div {
        border-color: blue;
        border-style: solid;
    }

    .item2 {
        grid-column-start: 2;
        grid-column-end: 4;
    }
</style>

<body>
    <div class="container">
        <div>Item 1</div>
        <div class="item2">Item 2</div>
        <div style="grid-row-start: 2; grid-row-end: 4;">Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
        <div>Item 7</div>
        <div>Item 8</div>
        <div>Item 9</div>
    </div>
    <p>This is the bottom of the page.</p>
</body>

</html>
